<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background with brand color -->
  <rect width="32" height="32" fill="#1a2a4a" rx="3"/>
  
  <!-- Three angled blue stripes at bottom -->
  <!-- Light blue stripe (top, longest) -->
  <path d="M 2 22 L 30 18 L 30 20 L 2 24 Z" fill="#87CEEB"/>
  
  <!-- Medium blue stripe (middle, medium length) -->
